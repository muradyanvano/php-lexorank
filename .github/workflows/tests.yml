name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

  phpunit:
    name: PHPUnit core (PHP ${{ matrix.php }}, ${{ matrix.stability }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        stability: [stable, lowest]
        exclude:
          - php: '8.4'
            stability: lowest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-core-${{ matrix.php }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-core-${{ matrix.php }}-${{ matrix.stability }}-
            composer-core-${{ matrix.php }}-

      - name: Install dependencies (${{ matrix.stability }})
        run: |
          if [ "${{ matrix.stability }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      - name: Composer audit
        run: composer audit

      - name: Run PHPUnit (Unit + Integration)
        run: vendor/bin/phpunit --testsuite=Unit,Integration --colors=always

  laravel:
    name: Laravel 12 (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-laravel-12-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-laravel-12-${{ matrix.php }}-

      - name: Install core + Laravel 12.61.1+ / Testbench 10
        run: |
          composer require --dev --no-update \
            "laravel/framework:^12.61.1" \
            "orchestra/testbench:^10.0" \
            "larastan/larastan:^3.0" \
            "phpunit/phpunit:^11.5.3"
          composer update --prefer-stable --no-interaction --no-progress

      - name: Show installed Laravel version
        run: composer show laravel/framework

      - name: Composer audit
        run: composer audit

      - name: Run Laravel test suite
        run: vendor/bin/phpunit --testsuite=Laravel --colors=always
