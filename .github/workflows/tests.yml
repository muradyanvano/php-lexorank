name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.stability }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        stability: [stable, lowest]
        exclude:
          - php: '8.4'
            stability: lowest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.stability }}-
            composer-${{ matrix.php }}-

      - name: Install dependencies (${{ matrix.stability }})
        run: |
          if [ "${{ matrix.stability }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      - name: Run PHPUnit (Unit + Integration)
        run: vendor/bin/phpunit --testsuite=Unit,Integration --colors=always

  laravel:
    name: Laravel (PHP ${{ matrix.php }}, Testbench ${{ matrix.testbench }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10 / Testbench 8 → PHPUnit 10
          - php: '8.1'
            testbench: '^8.35'
            phpunit: '^10.5'
            larastan: '^2.9'
            laravel: '10'
          # Laravel 11 / Testbench 9 → PHPUnit 11
          - php: '8.2'
            testbench: '^9.0'
            phpunit: '^11.5.3'
            larastan: '^3.0'
            laravel: '11'
          # Laravel 12 / Testbench 10 → PHPUnit 11
          - php: '8.3'
            testbench: '^10.0'
            phpunit: '^11.5.3'
            larastan: '^3.0'
            laravel: '12'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-laravel-${{ matrix.php }}-${{ matrix.testbench }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-laravel-${{ matrix.php }}-

      - name: Require Testbench ${{ matrix.testbench }} for Laravel ${{ matrix.laravel }}
        run: |
          composer require --dev --no-update \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}" \
            "larastan/larastan:${{ matrix.larastan }}"
          composer update --prefer-stable --no-interaction --no-progress

      - name: Run Laravel test suite
        run: vendor/bin/phpunit --testsuite=Laravel --colors=always
