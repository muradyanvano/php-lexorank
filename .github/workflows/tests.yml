name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.stability }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        stability: [stable, lowest]
        exclude:
          - php: '8.4'
            stability: lowest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.stability }}-
            composer-${{ matrix.php }}-

      - name: Strip Laravel deps on PHP 8.1 (core-only)
        if: matrix.php == '8.1'
        run: |
          # Laravel 12 / Testbench 10 require PHP 8.2+. Core remains PHP 8.1-compatible.
          composer remove --dev laravel/framework orchestra/testbench larastan/larastan --no-update
          composer require --dev --no-update "phpunit/phpunit:^10.5"

      - name: Install dependencies (${{ matrix.stability }})
        run: |
          if [ "${{ matrix.stability }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      - name: Run PHPUnit (Unit + Integration)
        run: vendor/bin/phpunit --testsuite=Unit,Integration --colors=always

  laravel:
    name: Laravel 12 (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-laravel-12-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-laravel-12-${{ matrix.php }}-

      - name: Install dependencies (Laravel 12.61.1+ / Testbench 10)
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Show installed Laravel version
        run: composer show laravel/framework

      - name: Composer audit
        run: composer audit

      - name: Run Laravel test suite
        run: vendor/bin/phpunit --testsuite=Laravel --colors=always
